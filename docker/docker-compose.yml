services:
  # -------------------------------------------------------------
  # 1. Apache Kafka en modo KRaft
  # -------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: fraud-kafka
    networks:
      - fraud-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m"
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Kafka UI
  # -------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fraud-kafka-ui
    networks:
      - fraud-network
    ports:
      - "8085:8080"
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "-Xmx256m"

  # -------------------------------------------------------------
  # 3. MinIO (S3 Compatible Object Storage)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: fraud-minio
    networks:
      - fraud-network
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: fraud-minio-init
    networks:
      - fraud-network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/bronze --ignore-existing;
      echo 'Bucket bronze asegurado.';
      exit 0;
      "

  # -------------------------------------------------------------
  # 4. ClickHouse (Capa Gold: Alertas & Historial)
  # -------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: fraud-clickhouse
    networks:
      - fraud-network
    ports:
      - "8123:8123"
      - "9009:9000"
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      CLICKHOUSE_DB: fraud_db
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 5. Generador Concurrente
  # -------------------------------------------------------------
  event-generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.generator
    container_name: fraud-event-generator
    networks:
      - fraud-network
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_TRANSACTIONS: financial-transactions
      EVENTS_PER_SECOND: 5.0
      FRAUD_RATIO: 0.15

  # -------------------------------------------------------------
  # 6. Consumidor Capa Bronze (Volcado crudo a MinIO)
  # -------------------------------------------------------------
  bronze-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.generator
    container_name: fraud-bronze-consumer
    networks:
      - fraud-network
    command: ["python", "-m", "src.bronze.bronze_consumer"]
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_TRANSACTIONS: financial-transactions
      BRONZE_CONSUMER_GROUP: bronze-s3-ingestion-group
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET_NAME: bronze
      MINIO_SECURE: "false"
      BRONZE_BATCH_SIZE: 500
      BRONZE_FLUSH_INTERVAL: 30

  # -------------------------------------------------------------
  # 7. Motor de Streaming PySpark (Capa Silver & Detecci?n de Fraude)
  # -------------------------------------------------------------
  spark-streaming:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: fraud-spark-streaming
    networks:
      - fraud-network
    deploy:
      resources:
        limits:
          memory: 1536M
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_TRANSACTIONS: financial-transactions
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
      CLICKHOUSE_DB: fraud_db

networks:
  fraud-network:
    name: fraud-network
    driver: bridge

volumes:
  kafka_data:
  minio_data:
  clickhouse_data:
